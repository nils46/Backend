version: '3.8'

# Define our two services: 'server' and 'client'
services:
  
  # The Node.js Backend
  server:
    build: ./server  # Tells docker-compose to look for a Dockerfile in ./server
    ports:
      - "8080:8080"  # Maps your computer's port 8080 to the container's port 8080
    environment:
      - NODE_ENV=development # You can add other environment variables here

  # The React Frontend
  client:
    build: ./client  # Tells docker-compose to look for a Dockerfile in ./client
    ports:
      - "3000:80"    # Maps your computer's port 3000 to the container's port 80 (Nginx)
    depends_on:
      - server       # Tells docker-compose to start the 'server' before the 'client'